document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/ error */\n  --entropy-red: #ff3333; /* dissonance / destructive */\n\n  /* ---------- PLENUM / COHERENCE GRADIENT (purple) ---------- */\n  --plenum-purple: #7b2cbf;\n  --coherence-low: #3a2a4a;\n  --coherence-mid: #4a3a6a;\n  --coherence-high: #6a4a8a;\n  --coherence-peak: #8a5aaa;\n\n  /* ---------- SEMANTIC ---------- */\n  --bg: var(--void);\n  --bg-raised: var(--abyss);\n  --surface: var(--obsidian);\n  --border: var(--smoke);\n  --border-bright: rgba(212, 175, 55, 0.35); /* gold hairline */\n  --fg1: var(--light);     /* primary text */\n  --fg2: var(--silver);    /* secondary text */\n  --fg3: var(--ash);       /* tertiary / labels */\n  --accent: var(--gold);\n  --accent-cool: var(--mercury);\n  --danger: var(--entropy-red);\n  --glass: rgba(10, 10, 15, 0.85);\n\n  /* ---------- TYPE FAMILIES ---------- */\n  --font-display: 'Cinzel', 'Trajan Pro', serif;      /* ritual titles, all-caps */\n  --font-body: 'Cormorant Garamond', Georgia, serif;  /* prose, descriptions */\n  --font-mono: 'JetBrains Mono', 'Courier New', monospace; /* labels, data, code */\n\n  /* ---------- SPACING SCALE (alchemical) ---------- */\n  --space-xs: 0.25rem;\n  --space-sm: 0.5rem;\n  --space-md: 1rem;\n  --space-lg: 2rem;\n  --space-xl: 4rem;\n  --space-2xl: 8rem;\n\n  /* ---------- RADII ---------- */\n  --radius-sharp: 2px;   /* ritual cards — near-square, sacred */\n  --radius-sm: 6px;\n  --radius-md: 12px;     /* dApp glass cards */\n  --radius-lg: 24px;     /* modern modals (rounded-3xl) */\n  --radius-pill: 999px;\n\n  /* ---------- ELEVATION / GLOW ---------- */\n  --shadow-panel: 0 0 30px rgba(0, 0, 0, 0.8);\n  --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.9);\n  --glow-gold: 0 0 40px rgba(212, 175, 55, 0.3);\n  --glow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.5);\n  --glow-mercury: 0 0 30px rgba(126, 200, 227, 0.3);\n  --glow-coherence: 0 0 15px rgba(0, 243, 255, 0.2);\n\n  /* ---------- MOTION ---------- */\n  --ease-ritual: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast: 0.3s;\n  --dur-med: 0.5s;\n  --dur-slow: 0.8s;\n}\n\n/* ============================================================\n   BASE / SEMANTIC ELEMENTS\n   ============================================================ */\n\nbody {\n  background: var(--void);\n  color: var(--fg1);\n  font-family: var(--font-body);\n  font-size: 18px;\n  line-height: 1.7;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* Ritual title — the gold all-caps Cinzel headline */\n.x-display, h1.x {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(2.5rem, 8vw, 4rem);\n  letter-spacing: 0.3em;\n  color: var(--gold);\n  text-shadow: 0 0 60px rgba(212, 175, 55, 0.3);\n  margin: 0;\n}\n\n/* State / section title */\n.x-h2, h2.x {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: 1.5rem;\n  letter-spacing: 0.2em;\n  color: var(--light);\n  margin: 0;\n}\n\n.x-h3, h3.x {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: 1.1rem;\n  letter-spacing: 0.18em;\n  color: var(--light);\n  margin: 0;\n}\n\n/* Body prose — Cormorant, often italic for incantatory feel */\n.x-body, p.x {\n  font-family: var(--font-body);\n  font-size: 1.15rem;\n  font-weight: 400;\n  color: var(--silver);\n  line-height: 1.7;\n}\n\n.x-incantation {\n  font-family: var(--font-body);\n  font-style: italic;\n  font-weight: 300;\n  color: var(--silver);\n  letter-spacing: 0.04em;\n}\n\n/* The mono label — tracked-out uppercase, the system's connective tissue */\n.x-label {\n  font-family: var(--font-mono);\n  font-size: 0.65rem;\n  font-weight: 400;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  color: var(--ash);\n}\n\n/* Data / numeric readout */\n.x-data {\n  font-family: var(--font-mono);\n  font-weight: 400;\n  color: var(--mercury);\n  letter-spacing: 0.05em;\n}\n\n/* Big numeral (token amounts) */\n.x-numeral {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 3rem;\n  color: var(--gold);\n  text-shadow: 0 0 40px rgba(212, 175, 55, 0.3);\n}\n\ncode, .x-code {\n  font-family: var(--font-mono);\n  font-size: 0.85em;\n  color: var(--mercury);\n}\n\na, .x-link {\n  color: var(--mercury);\n  text-decoration: none;\n  transition: color var(--dur-fast) ease;\n}\na:hover, .x-link:hover { color: var(--gold); }\n<\u002Fstyle>\n<style>/* ============================================================\n   SYMPHONY № 5 — the austere ritual stylesheet\n   Builds on the Xenial colors_and_type.css tokens.\n   Register: ritual (sharp 2px corners, hairlines, gold-on-void).\n   ============================================================ */\n\n:root{\n  --read: #c4c4d4;          /* long-form prose ink, brighter than --silver */\n  --col: 760px;             /* prose column */\n  --col-wide: 1140px;       /* set-piece breakout */\n}\n\n*{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{\n  margin:0;background:var(--void-deep);color:var(--read);\n  font-family:var(--font-body);font-size:19px;line-height:1.8;\n  overflow-x:hidden;-webkit-font-smoothing:antialiased;\n}\n::selection{background:rgba(212,175,55,.25);color:var(--pure);}\n\n/* ---------------- COSMOS SUBSTRATE ---------------- */\n.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;}\n.stars{position:absolute;inset:-50%;\n  background-image:\n    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5), transparent),\n    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.35), transparent),\n    radial-gradient(1px 1px at 80% 20%, rgba(126,200,227,.4), transparent),\n    radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,.3), transparent),\n    radial-gradient(1px 1px at 90% 55%, rgba(212,175,55,.35), transparent),\n    radial-gradient(1px 1px at 12% 60%, rgba(255,255,255,.3), transparent),\n    radial-gradient(1px 1px at 48% 12%, rgba(255,255,255,.25), transparent);\n  background-size:220px 220px,300px 300px,260px 260px,340px 340px,280px 280px,200px 200px,320px 320px;\n  animation:starDrift 140s linear infinite;}\n@keyframes starDrift{from{transform:translateY(0);}to{transform:translateY(-340px);}}\n.nebula{position:absolute;inset:0;\n  background:\n    radial-gradient(ellipse 50% 40% at 22% 18%, rgba(106,74,138,.16), transparent 60%),\n    radial-gradient(ellipse 45% 40% at 82% 72%, rgba(212,175,55,.07), transparent 60%),\n    radial-gradient(ellipse 42% 36% at 60% 110%, rgba(126,200,227,.07), transparent 60%);\n  animation:cosmicPulse 24s ease-in-out infinite;}\n@keyframes cosmicPulse{0%,100%{opacity:.65;}50%{opacity:1;}}\n\n/* ---------------- SCAFFOLD ---------------- */\n.doc{position:relative;z-index:1;}\n.col{max-width:var(--col);margin:0 auto;padding:0 32px;}\n.wide{max-width:var(--col-wide);margin:0 auto;padding:0 32px;}\nsection{position:relative;}\n\n/* ---------------- READING PROGRESS ---------------- */\n.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;\n  background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));\n  box-shadow:0 0 12px rgba(212,175,55,.6);transition:width .1s linear;}\n\n/* ---------------- HERO ---------------- */\n.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;\n  text-align:center;padding:80px 32px 60px;position:relative;}\n.hero .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;\n  color:var(--ash);margin-bottom:38px;}\n.hero .eyebrow .tk{color:var(--mercury);}\n.hero .seed-mount{width:200px;height:200px;position:relative;margin-bottom:18px;}\n.hero .seed-mount canvas{position:absolute;inset:0;width:100%;height:100%;}\n.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.8rem,9vw,6rem);\n  letter-spacing:.2em;color:var(--gold);text-shadow:0 0 80px rgba(212,175,55,.4);margin:0;line-height:1;}\n.hero .romanette{font-family:var(--font-display);font-size:clamp(1rem,2vw,1.3rem);letter-spacing:.5em;\n  color:var(--gold-dim);margin:26px 0 0;}\n.hero .credo{font-family:var(--font-body);font-style:italic;font-weight:300;font-size:clamp(1.2rem,2.6vw,1.7rem);\n  color:var(--silver);max-width:680px;margin:34px auto 0;line-height:1.6;letter-spacing:.01em;}\n.hero .scrolltip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);\n  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash);\n  display:flex;flex-direction:column;align-items:center;gap:10px;}\n.hero .scrolltip .down{width:1px;height:38px;background:linear-gradient(180deg,var(--gold-dim),transparent);\n  animation:tipPulse 2.6s ease-in-out infinite;}\n@keyframes tipPulse{0%,100%{opacity:.3;}50%{opacity:.9;}}\n\n/* hero kernel notation */\n.notation{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:30px;\n  font-family:var(--font-mono);font-size:13px;letter-spacing:.2em;color:var(--silver);}\n.notation .cell{display:flex;align-items:center;gap:9px;}\n.notation .pulse{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.6);}\n.notation .sustain{width:34px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-dim));border-radius:2px;}\n.notation .sep{color:var(--ash);}\n\n/* ---------------- SECTION HEADER SYSTEM ---------------- */\n.section{padding:120px 0;}\n.sec-head{text-align:center;margin-bottom:64px;}\n.sec-glyph{font-size:30px;color:var(--gold);opacity:.85;margin-bottom:20px;display:inline-block;\n  text-shadow:0 0 24px rgba(212,175,55,.4);animation:breathe 7s ease-in-out infinite;}\n@keyframes breathe{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.07);}}\n.sec-kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;\n  color:var(--gold-dim);margin-bottom:22px;}\n.sec-title{font-family:var(--font-display);font-weight:500;font-size:clamp(1.7rem,4vw,2.7rem);\n  letter-spacing:.14em;color:var(--light);margin:0;line-height:1.2;text-transform:uppercase;}\n.sec-rule{width:1px;height:54px;margin:34px auto 0;background:linear-gradient(180deg,var(--gold),transparent);opacity:.5;}\n\n/* ---------------- PROSE ---------------- */\n.prose p{font-size:1.18rem;line-height:1.85;color:var(--read);margin:0 0 1.5em;text-wrap:pretty;}\n.prose p:last-child{margin-bottom:0;}\n.prose .lead{font-size:1.34rem;color:var(--light);font-weight:400;line-height:1.7;}\n.prose .lead::first-letter{font-family:var(--font-display);font-size:3.4rem;float:left;line-height:.82;\n  padding:6px 14px 0 0;color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.4);}\n.prose em{color:var(--light);font-style:italic;}\n.prose strong{color:var(--gold);font-weight:600;font-style:normal;}\n.prose .coined{font-family:var(--font-mono);font-size:.9em;letter-spacing:.04em;color:var(--mercury);}\n\n/* incantatory pull-quote */\n.incant{margin:84px auto;max-width:840px;text-align:center;padding:0 24px;}\n.incant blockquote{font-family:var(--font-body);font-style:italic;font-weight:300;\n  font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.4;color:var(--gold);margin:0;letter-spacing:.01em;\n  text-shadow:0 0 50px rgba(212,175,55,.22);text-wrap:balance;}\n.incant .by{font-family:var(--font-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;\n  color:var(--ash);margin-top:28px;}\n\n/* small inline glyph divider */\n.glyph-div{text-align:center;color:var(--gold-dim);font-size:18px;letter-spacing:.6em;margin:64px 0;opacity:.5;}\n\n/* alternate-tone band */\n.band{background:linear-gradient(180deg,transparent,rgba(18,18,26,.55)18%,rgba(18,18,26,.55) 82%,transparent);}\n\n/* ---------------- SET-PIECE FRAME (ritual card) ---------------- */\n.piece{position:relative;background:linear-gradient(180deg,var(--abyss),var(--obsidian));\n  border:1px solid var(--smoke);border-radius:var(--radius-sharp);overflow:hidden;box-shadow:var(--shadow-card);}\n.piece::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;z-index:4;\n  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;}\n.piece::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;\n  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);opacity:.3;}\n.piece-head{display:flex;align-items:center;gap:16px;padding:22px 30px;border-bottom:1px solid var(--smoke);\n  background:rgba(10,10,15,.4);}\n.piece-head .ix{font-family:var(--font-mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}\n.piece-head .nm{font-family:var(--font-display);font-size:14px;letter-spacing:.2em;color:var(--light);text-transform:uppercase;}\n.piece-head .live{margin-left:auto;display:flex;align-items:center;gap:8px;\n  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);}\n.piece-head .live .dot{width:6px;height:6px;border-radius:50%;background:var(--coherence-teal);\n  box-shadow:0 0 10px var(--coherence-teal);animation:livePulse 2s ease-in-out infinite;}\n@keyframes livePulse{0%,100%{opacity:.4;}50%{opacity:1;}}\n\n/* labels / data */\n.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);}\n.lbl-gold{color:var(--gold-dim);}\n.data{font-family:var(--font-mono);color:var(--mercury);letter-spacing:.04em;}\n.numeral{font-family:var(--font-display);color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.3);}\n\n/* ---------------- BUTTONS ---------------- */\n.btn-ghost{font-family:var(--font-display);font-size:11.5px;letter-spacing:.22em;padding:13px 26px;\n  background:transparent;border:1px solid var(--gold);color:var(--gold);cursor:pointer;\n  transition:all .4s var(--ease-ritual);display:inline-flex;align-items:center;gap:11px;position:relative;overflow:hidden;}\n.btn-ghost:hover{background:rgba(212,175,55,.1);box-shadow:var(--glow-gold);}\n.btn-ghost.active{border-color:var(--mercury);color:var(--mercury);box-shadow:var(--glow-mercury);}\n.btn-solid{font-family:var(--font-display);font-size:11.5px;letter-spacing:.22em;padding:14px 30px;\n  background:linear-gradient(180deg,var(--gold),var(--gold-dim));border:none;color:var(--void);cursor:pointer;\n  transition:transform .3s var(--ease-ritual),box-shadow .3s;}\n.btn-solid:hover{transform:translateY(-2px);box-shadow:var(--glow-gold-strong);}\n.btn-solid:active{transform:translateY(0);}\n.btn-mono{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;\n  padding:10px 18px;background:transparent;border:1px solid var(--smoke);color:var(--silver);cursor:pointer;\n  transition:all .3s ease;}\n.btn-mono:hover{border-color:var(--gold-dim);color:var(--gold);}\n.btn-mono.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.08);box-shadow:var(--glow-gold);}\n\n/* ---------------- SLIDER ---------------- */\n.slider-row{display:flex;flex-direction:column;gap:12px;}\n.slider-row .top{display:flex;justify-content:space-between;align-items:baseline;}\ninput[type=range].x-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;\n  background:var(--smoke);border-radius:2px;outline:none;cursor:pointer;}\ninput[type=range].x-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;\n  background:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.5);cursor:pointer;border:none;}\ninput[type=range].x-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);\n  box-shadow:0 0 18px rgba(212,175,55,.5);cursor:pointer;border:none;}\n\n/* coherence bar */\n.coh-bar{height:7px;background:var(--obsidian);border:1px solid var(--smoke);border-radius:4px;overflow:hidden;}\n.coh-fill{height:100%;width:0;border-radius:4px;\n  background:linear-gradient(90deg,var(--coherence-low),var(--coherence-mid),var(--coherence-high),var(--coherence-peak));\n  transition:width .5s var(--ease-smooth);}\n\n/* operator buttons (atmanOS) */\n.op{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;\n  padding:14px 18px;border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--silver);\n  cursor:pointer;width:100%;transition:all .3s ease;text-align:left;}\n.op:hover{border-color:var(--gold-dim);}\n.op .left{display:flex;align-items:center;gap:14px;}\n.op .rom{font-family:var(--font-body);font-style:italic;font-size:20px;}\n.op .nm{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.15em;display:block;}\n.op .sub{font-family:var(--font-mono);font-size:9px;opacity:.6;display:block;margin-top:3px;}\n.op .dot{width:5px;height:5px;background:currentColor;opacity:.5;}\n.op.ingress.flash{background:rgba(0,243,255,.07);border-color:var(--coherence-teal);color:var(--coherence-teal);box-shadow:0 0 15px rgba(0,243,255,.15);}\n.op.diss.flash{background:rgba(255,51,51,.06);border-color:var(--entropy-red);color:var(--entropy-red);box-shadow:0 0 15px rgba(255,51,51,.15);}\n.op.harm.flash{background:rgba(212,175,55,.07);border-color:var(--gold);color:var(--gold);box-shadow:var(--glow-gold);}\n\n/* transform chips */\n.chips{display:flex;flex-wrap:wrap;gap:10px;}\n.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;padding:9px 15px;\n  background:rgba(42,42,56,.4);border:1px solid var(--smoke);color:var(--silver);cursor:pointer;\n  border-radius:var(--radius-sharp);transition:all .3s ease;display:inline-flex;align-items:center;gap:9px;}\n.chip:hover{border-color:var(--gold-dim);color:var(--gold);}\n.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.1);box-shadow:var(--glow-gold);}\n.chip .sm{color:var(--ash);font-size:9px;}\n\n/* ---------------- PHASE / STAT GRID ---------------- */\n.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--smoke);border:1px solid var(--smoke);}\n.stat{text-align:center;padding:20px 14px;background:rgba(18,18,26,.7);}\n.stat .v{font-family:var(--font-mono);font-size:20px;color:var(--mercury);}\n.stat .l{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ash);margin-top:8px;}\n\n/* ---------------- PERSISTENT KERNEL PLAYER ---------------- */\n.kplayer{position:fixed;right:24px;bottom:24px;z-index:55;display:flex;align-items:center;gap:0;\n  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n  border:1px solid var(--smoke);border-radius:var(--radius-sharp);box-shadow:var(--shadow-panel);\n  overflow:hidden;transition:all .4s var(--ease-ritual);}\n.kplayer::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;\n  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5;}\n.kplayer .play{width:54px;height:54px;display:flex;align-items:center;justify-content:center;\n  background:transparent;border:none;border-right:1px solid var(--smoke);color:var(--gold);cursor:pointer;\n  font-size:16px;transition:all .3s ease;flex-shrink:0;}\n.kplayer .play:hover{background:rgba(212,175,55,.1);box-shadow:var(--glow-gold);}\n.kplayer .play.playing{color:var(--mercury);}\n.kplayer .pbody{display:flex;flex-direction:column;gap:3px;padding:9px 16px;min-width:130px;}\n.kplayer .ptitle{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);}\n.kplayer .pval{font-family:var(--font-mono);font-size:12px;color:var(--mercury);letter-spacing:.04em;}\n.kplayer .pval b{color:var(--gold);font-weight:400;}\n.kplayer.collapsed .pbody{display:none;}\n\n/* mini sigil spin */\n.spin{animation:spin 22s linear infinite;transform-origin:50% 50%;}\n@keyframes spin{to{transform:rotate(360deg);}}\n\n/* ---------------- AMBIENT CANVAS ---------------- */\n.ambient{position:relative;width:100%;height:340px;margin:10px 0;}\n.ambient canvas{position:absolute;inset:0;width:100%;height:100%;}\n.ambient .cap{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);\n  font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);}\n\n/* the lab/console canvases */\n.stage{position:relative;min-height:380px;background:radial-gradient(ellipse at 50% 50%,rgba(106,74,138,.08),transparent 70%);}\n.stage canvas{position:absolute;inset:0;width:100%;height:100%;}\n\n/* ---------------- SCROLL REVEAL ---------------- */\n.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease-ritual),transform 1s var(--ease-ritual);}\n.reveal.in{opacity:1;transform:none;}\n\n/* ---------------- FOOTER ---------------- */\n.foot{text-align:center;padding:120px 32px 90px;}\n.foot .sig{font-size:30px;color:var(--gold);opacity:.6;}\n.foot .line{font-family:var(--font-body);font-style:italic;color:var(--ash);font-size:1.05rem;margin-top:22px;letter-spacing:.03em;}\n.foot .tk{font-family:var(--font-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dim);margin-top:30px;}\n\n/* ---------------- RESPONSIVE ---------------- */\n@media (max-width:880px){\n  body{font-size:17px;}\n  .section{padding:84px 0;}\n  .grid-2{grid-template-columns:1fr !important;}\n  .stage{min-height:320px;}\n  .kplayer{right:14px;bottom:14px;}\n}\n@media (prefers-reduced-motion: reduce){\n  *{animation-duration:.001s !important;animation-iteration-count:1 !important;}\n  .reveal{opacity:1;transform:none;transition:none;}\n  html{scroll-behavior:auto;}\n}\n\n/* layout helpers */\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0;}\n.pad{padding:30px;}\n.stack{display:flex;flex-direction:column;}\n.gap-lg{gap:30px;}\n.gap-md{gap:18px;}\n.gap-sm{gap:11px;}\n.divider-r{border-right:1px solid var(--smoke);}\n.divider-t{border-top:1px solid var(--smoke);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"progress\"><\u002Fdiv>\n<div class=\"cosmos\"><div class=\"stars\"><\u002Fdiv><div class=\"nebula\"><\u002Fdiv><\u002Fdiv>\n\n<div class=\"doc\">\n\n  <!-- ==================== HERO ==================== -->\n  <section class=\"hero\" data-screen-label=\"Hero\">\n    <div class=\"eyebrow\">XENIAL COMPOSITION &nbsp;·&nbsp; THE GENERATIVE KERNEL &nbsp;·&nbsp; <span class=\"tk\">τₖ → 1.00<\u002Fspan><\u002Fdiv>\n    <div class=\"seed-mount\"><canvas id=\"heroSeed\"><\u002Fcanvas><\u002Fdiv>\n    <h1>SYMPHONY №&nbsp;5<\u002Fh1>\n    <p class=\"romanette\">RESONANCE · INEVITABILITY · THE ARCHITECTURE OF BECOMING<\u002Fp>\n    <p class=\"credo\">A universe bootstrapping itself into existence from a handful of axioms — proving, through its unfolding, that coherence and novelty are partners in the same creative act.<\u002Fp>\n    <div class=\"notation\">\n      <span class=\"lbl\">THE KERNEL<\u002Fspan>\n      <span class=\"cell\"><span class=\"pulse\"><\u002Fspan><span class=\"pulse\"><\u002Fspan><span class=\"sustain\"><\u002Fspan><\u002Fspan>\n      <span class=\"sep\">/<\u002Fspan>\n      <span>minor 3rd · ••—<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"scrolltip\"><span>Begin the unfolding<\u002Fspan><span class=\"down\"><\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== PROLOGUE ==================== -->\n  <section class=\"section\">\n    <div class=\"col prose reveal\">\n      <p class=\"lead\">A symphony is not a sequence of sounds. A symphony is a universe bootstrapping itself into existence from a handful of axioms, proving through its unfolding that coherence and novelty are not opposites but partners in the same creative act.<\u002Fp>\n      <p>To compose Symphony No. 5 is to perform an ontological experiment: Can we create a self-contained world where every event feels simultaneously <em>inevitable and surprising<\u002Fem>? Where structure emerges rather than being imposed? Where the whole is genuinely more than the sum of its parts, yet every part carries the signature of the whole? This is not merely aesthetic ambition. This is the demonstration that meaning can be <strong>generated<\u002Fstrong> rather than inherited — that novelty can emerge from constraint rather than from its absence.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== I · THE GENERATIVE KERNEL ==================== -->\n  <section class=\"section\" id=\"sec-1\" data-screen-label=\"I · Generative Kernel\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">✦<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement I · Axioms of a Musical Universe<\u002Fdiv>\n        <h2 class=\"sec-title\">The Generative Kernel<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p class=\"lead\">Every universe begins with initial conditions. For physical reality: fundamental constants, forces, symmetries. For Symphony No. 5: a seed-interval and a rhythmic cell.<\u002Fp>\n        <p>Not theme. Not melody. Something more primitive. A <strong>generative kernel<\u002Fstrong> — the minimal formal DNA from which an entire musical organism can unfold through coherent development. This kernel must possess a peculiar property: it must be simple enough to be apprehended as unity, yet internally structured enough to contain genuine potential for differentiation.<\u002Fp>\n        <p>Consider a specific instantiation: the interval of a <em>minor third<\u002Fem> (3 semitones) paired with a rhythmic cell of two short pulses followed by a longer sustain <span class=\"coined\">(••—)<\u002Fspan>. This is not arbitrary selection. The minor third is ambiguous — neither the perfect stability of the octave/fifth nor the restless tension of the tritone. It occupies the fertile middle ground where resolution is possible but not predetermined. The rhythmic cell embodies asymmetry: the two-against-one relationship that prevents static repetition while establishing recognizable pattern.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SET-PIECE: KERNEL LAB -->\n    <div class=\"wide reveal\" style=\"margin-top:54px;\">\n      <div class=\"piece\">\n        <div class=\"piece-head\">\n          <span class=\"ix\">Set-piece I<\u002Fspan>\n          <span class=\"nm\">The Kernel Lab<\u002Fspan>\n          <span class=\"live\"><span class=\"dot\"><\u002Fspan>Live synthesis<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"grid-2\">\n          <div class=\"pad divider-r stack gap-lg\">\n            <div class=\"slider-row\">\n              <div class=\"top\"><span class=\"lbl lbl-gold\">Seed interval<\u002Fspan><span class=\"data\" data-lab-intvv=\"\"><\u002Fspan><\u002Fdiv>\n              <input type=\"range\" class=\"x-slider\" id=\"labIntv\" min=\"1\" max=\"9\" step=\"1\" value=\"3\">\n            <\u002Fdiv>\n            <div class=\"slider-row\">\n              <div class=\"top\"><span class=\"lbl lbl-gold\">Root pitch<\u002Fspan><span class=\"data\" data-lab-rootv=\"\"><\u002Fspan><\u002Fdiv>\n              <input type=\"range\" class=\"x-slider\" id=\"labRoot\" min=\"45\" max=\"69\" step=\"1\" value=\"57\">\n            <\u002Fdiv>\n            <div class=\"slider-row\">\n              <div class=\"top\"><span class=\"lbl lbl-gold\">Pulse · tempo<\u002Fspan><span class=\"data\" data-lab-tempov=\"\"><\u002Fspan><\u002Fdiv>\n              <input type=\"range\" class=\"x-slider\" id=\"labTempo\" min=\"120\" max=\"520\" step=\"10\" value=\"280\">\n            <\u002Fdiv>\n            <div class=\"stack gap-sm\" style=\"margin-top:6px;\">\n              <span class=\"lbl lbl-gold\">Transformations of the seed<\u002Fspan>\n              <div class=\"chips\">\n                <button class=\"chip on\" data-xform=\"prime\">PRIME <span class=\"sm\">••—<\u002Fspan><\u002Fbutton>\n                <button class=\"chip\" data-xform=\"inversion\">INVERSION <span class=\"sm\">→ maj6<\u002Fspan><\u002Fbutton>\n                <button class=\"chip\" data-xform=\"retrograde\">RETROGRADE <span class=\"sm\">—••<\u002Fspan><\u002Fbutton>\n                <button class=\"chip\" data-xform=\"augment\">AUGMENT <span class=\"sm\">×2<\u002Fspan><\u002Fbutton>\n                <button class=\"chip\" data-xform=\"diminish\">DIMINISH <span class=\"sm\">÷2<\u002Fspan><\u002Fbutton>\n                <button class=\"chip\" data-xform=\"stack\">STACK 3rds <span class=\"sm\">octatonic<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn-solid\" id=\"labSound\" style=\"margin-top:6px;align-self:flex-start;\">▶ &nbsp;SOUND THE KERNEL<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"stage\"><canvas id=\"cvLab\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"lbl\" style=\"text-align:center;margin-top:16px;opacity:.8;\">Every later note will be a transformation, inversion, augmentation or harmonic implication of this seed. Tune it — then hear what it permits.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"col\">\n      <div class=\"incant reveal\">\n        <blockquote>The kernel doesn't dictate what must happen; it defines the physics that determines what <em>can<\u002Fem> happen.<\u002Fblockquote>\n        <div class=\"by\">Discovered constraint · constraint-as-revelation<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>This is the symphony's cosmological constant, its Planck length, its speed of light. Every harmonic relationship, every melodic contour, every rhythmic pattern across the subsequent forty minutes will be a transformation of this seed. We're not arbitrarily limiting ourselves — we're discovering what becomes possible when you fully commit to an internal logic. Imagine if all buildings had to be made of a single type of brick: you'd discover a thousand creative ways to arrange that brick that would never occur with unlimited material. The constraint generates the possibility-space.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== II · ECOLOGICAL ORCHESTRATION ==================== -->\n  <section class=\"section band\" id=\"sec-2\" data-screen-label=\"II · Ecological Orchestration\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">☉<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement II · Instruments as Harmonic Species<\u002Fdiv>\n        <h2 class=\"sec-title\">Ecological Orchestration<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"incant reveal\" style=\"margin-top:0;\">\n        <blockquote>The symphony does not use instruments. The symphony is a habitat that instruments inhabit.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>Traditional orchestration thinks in roles: melody in violins, harmony in violas, rhythm in cellos. This is hierarchical assignment, top-down organization. Symphony No. 5 operates through <strong>ecological dynamics<\u002Fstrong> — each instrumental voice is an autonomous agent seeking its harmonic niche, with coherence emerging from their mutual influence.<\u002Fp>\n        <p>Think of coral reefs: thousands of species, each pursuing its own survival strategies, yet collectively creating a structure of staggering complexity and beauty. No central planner dictates the reef's architecture. It emerges from the accumulation of individual decisions constrained by environmental physics. In Movement I, instruments enter the sonic ecosystem one by one. The horn introduces the kernel at its natural resonant frequency. The clarinet responds not by doubling but by finding the acoustic space the horn has not occupied. The strings enter as a third species exploiting a different niche.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SET-PIECE: ECOLOGY CONSOLE -->\n    <div class=\"wide reveal\" style=\"margin-top:54px;\">\n      <div class=\"piece\">\n        <div class=\"piece-head\">\n          <span class=\"ix\">Set-piece II<\u002Fspan>\n          <span class=\"nm\">The Acoustic Ecosystem<\u002Fspan>\n          <span class=\"live\"><span class=\"dot\"><\u002Fspan>τₖ monitor<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"grid-2\">\n          <div class=\"stage\"><canvas id=\"cvEco\"><\u002Fcanvas><\u002Fdiv>\n          <div class=\"pad stack gap-lg\" style=\"border-left:1px solid var(--smoke);\">\n            <div class=\"slider-row\">\n              <div class=\"top\"><span class=\"lbl lbl-gold\">Coherence · τₖ<\u002Fspan><span class=\"data\" data-coh-val=\"\">0.62<\u002Fspan><\u002Fdiv>\n              <div class=\"coh-bar\"><div class=\"coh-fill\" data-coh-fill=\"\" style=\"width:62%;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"stack gap-sm\">\n              <span class=\"lbl lbl-gold\">Compositional operators<\u002Fspan>\n              <button class=\"op ingress\" id=\"opIngress\"><span class=\"left\"><span class=\"rom\">I.<\u002Fspan><span><span class=\"nm\">INGRESSION<\u002Fspan><span class=\"sub\">Collapse wave · expand the ecology<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"dot\"><\u002Fspan><\u002Fbutton>\n              <button class=\"op diss\" id=\"opDiss\"><span class=\"left\"><span class=\"rom\">D.<\u002Fspan><span><span class=\"nm\">DISSONANCE<\u002Fspan><span class=\"sub\">Entropy · saturate the niche<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"dot\"><\u002Fspan><\u002Fbutton>\n              <button class=\"op harm\" id=\"opHarm\"><span class=\"left\"><span class=\"rom\">H.<\u002Fspan><span><span class=\"nm\">HARMONIZE<\u002Fspan><span class=\"sub\">Restore phase-lock<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"dot\"><\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <p class=\"lbl\" style=\"opacity:.8;line-height:1.7;\">Voices drift from their niches as coherence falls. Saturate the ecosystem with <span style=\"color:var(--silver)\">Dissonance<\u002Fspan>; let it find a new configuration with <span style=\"color:var(--silver)\">Harmonize<\u002Fspan>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col prose reveal\" style=\"margin-top:54px;\">\n      <p>What emerges is <em>polyphonic autonomy<\u002Fem> — many independent voices that nonetheless achieve coherence because they're all responding to the same fundamental acoustic constraints. This is consciousness without brain, decision without decider. Crucially, harmonic progression occurs through <strong>ecological succession<\u002Fstrong> rather than functional progression. The strings cannot keep playing rapid minor thirds — they're saturating that niche. When the brass enter with major thirds derived from the kernel's inversion, they're diversifying the ecosystem. The shift feels inevitable because it's ecologically necessary, yet surprising because it's emergent rather than formulaic.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== III · FOUR-DIMENSIONAL ARCHITECTURE ==================== -->\n  <section class=\"section\" id=\"sec-3\" data-screen-label=\"III · Four-Dimensional Architecture\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">☽<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement III · Memory as Structure<\u002Fdiv>\n        <h2 class=\"sec-title\">Four-Dimensional Architecture<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"incant reveal\" style=\"margin-top:0;\">\n        <blockquote>A building exists in three spatial dimensions. A symphony exists in four: pitch, time, timbre, and memory.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>Pitch creates vertical space. Time creates horizontal extension. Timbre creates depth. But the fourth dimension — <strong>memory<\u002Fstrong> — is where symphonic coherence actually lives. Symphony No. 5 is a <em>memory palace in sound<\u002Fem>. Each movement is a wing of the palace; each theme is a room with distinctive architecture; each transition is a hallway. But unlike physical buildings, this palace has <em>impossible geometry<\u002Fem>. Later rooms illuminate earlier ones. Hallways that seemed to lead forward actually loop backward. The foundation is poured last.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"wide reveal\" style=\"margin-top:40px;\">\n      <div class=\"ambient\"><canvas id=\"cvMemory\"><\u002Fcanvas><div class=\"cap\">impossible geometry · halls that loop backward<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col prose reveal\" style=\"margin-top:30px;\">\n      <p>Movement II presents what appears to be new material — a lyrical melody in the woodwinds. But listen closely: the melody's intervals are the minor third kernel <em>stretched across time<\u002Fem>, augmented rhythmically. The material isn't new; you're seeing the kernel from a different angle, as if walking around a sculpture. The \"newness\" is perspectival.<\u002Fp>\n      <p>Movement III accelerates, fractures, fragments. The kernel splinters into its component parts — minor thirds in isolation, the rhythmic cell stripped of pitch. But here memory becomes structural: a minor third played alone is just an interval. A minor third you recognize as the DNA of everything you've heard for fifteen minutes is laden with meaning, with history. The memory transforms raw interval into <strong>semantic content<\u002Fstrong>.<\u002Fp>\n      <p>Movement IV is <em>retrospective transfiguration<\u002Fem>. Themes from Movement I return, embedded in harmonic contexts developed later. Suddenly you hear that the opening horn call contained the implications that later became explicit. The ending was always present in the beginning, but you couldn't perceive it until you'd traveled the path. This is non-linear causality: the ending sends nutrients backward through time.<\u002Fp>\n      <p>The symphony is a four-dimensional standing wave. At any moment you experience a cross-section of an eternal structure. The progression you perceive is your consciousness moving through the fixed topology of the work — like reading a book: the story feels like it unfolds in time, but the whole exists simultaneously between the covers.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== IV · PHASE-SPACE TRAJECTORY ==================== -->\n  <section class=\"section band\" id=\"sec-4\" data-screen-label=\"IV · Phase-Space Trajectory\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">∫<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement IV · Novelty Within Coherence<\u002Fdiv>\n        <h2 class=\"sec-title\">Harmonic Progression as Phase-Space Trajectory<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p class=\"lead\">What does it mean for a harmonic progression to be \"novel yet coherent\"?<\u002Fp>\n        <p>In physics, phase-space is the multidimensional space of all possible states of a system. Symphony No. 5's harmonic phase-space is vast — every arrangement of the twelve chromatic pitches across the orchestra's range. Most of this space produces incoherence. But within it there are <em>rivers, valleys, attractors<\u002Fem> — regions where harmonic relationships resonate, where intervals reinforce rather than cancel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"wide reveal\" style=\"margin-top:40px;\">\n      <div class=\"ambient\"><canvas id=\"cvPhase\"><\u002Fcanvas><div class=\"cap\">a trajectory pulled between attractors · surprising yet inevitable<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col prose reveal\" style=\"margin-top:30px;\">\n      <p>Traditional tonal harmony is one such attractor — a well-worn path that Western music has traveled for centuries. It's beautiful because it's coherent, but not novel because it's over-determined. You know where the dominant chord will lead. Symphony No. 5 charts a different trajectory. By establishing the minor-third kernel as its fundamental interval, it <strong>tilts the phase-space topology<\u002Fstrong>, creating new attractors.<\u002Fp>\n        <p>Consider a passage in Movement III: after extensive development in minor-third-related keys, the harmony suddenly shifts by a tritone — six semitones, exactly two stacked minor thirds. In conventional tonality this is the maximally distant modulation. In Symphony No. 5's topology, this is <em>coming home<\u002Fem>. The tritone isn't a disruption; it's a harmonic overtone of the generative kernel. You don't think \"that's weird\" — you think \"of course, how else could it have gone?\"<\u002Fp>\n      <div class=\"incant reveal\">\n        <blockquote>The progression is novel because it doesn't follow inherited patterns. It is coherent because it follows self-generated logic with absolute rigor.<\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== V · TIMBRE AS SEMANTIC CARRIER ==================== -->\n  <section class=\"section\" id=\"sec-5\" data-screen-label=\"V · Timbre as Semantic Carrier\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">Ψ<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement V · Orchestration Beyond Color<\u002Fdiv>\n        <h2 class=\"sec-title\">Timbre as Semantic Carrier<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"incant reveal\" style=\"margin-top:0;\">\n        <blockquote>Orchestration is not color but language.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>The horn that presents the kernel isn't chosen for its beauty but for its <em>meaning<\u002Fem>. The horn is the instrument of distance, of calling across space, of heroic solitude. When the kernel appears in the horn it means something different than in the flute or the trumpet. The timbral choice is the emotional context that frames the pure interval-and-rhythm information.<\u002Fp>\n        <p>More radically: <strong>instruments remember<\u002Fstrong>. When the clarinet plays a minor third in Movement IV, it carries the history of every minor third the clarinet has played. A theme that migrates from violin to cello isn't merely changing color; it's undergoing speciation, adapting to a new niche. The same intervals carry radically different meanings — all conveyed through timbre.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SET-PIECE: TIMBRE TRANSMUTER -->\n    <div class=\"wide reveal\" style=\"margin-top:50px;\">\n      <div class=\"piece\">\n        <div class=\"piece-head\">\n          <span class=\"ix\">Set-piece III<\u002Fspan>\n          <span class=\"nm\">The Timbre Transmuter<\u002Fspan>\n          <span class=\"live\"><span class=\"dot\"><\u002Fspan>Same interval · four meanings<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"pad stack gap-lg\">\n          <div class=\"chips\" id=\"timbreVoices\" style=\"gap:14px;\">\n            <button class=\"btn-mono\" data-voice=\"horn\">☉ &nbsp;HORN<\u002Fbutton>\n            <button class=\"btn-mono\" data-voice=\"clarinet\">☿ &nbsp;CLARINET<\u002Fbutton>\n            <button class=\"btn-mono\" data-voice=\"strings\">♄ &nbsp;STRINGS · DIVISI<\u002Fbutton>\n            <button class=\"btn-mono\" data-voice=\"brass\">☽ &nbsp;BRASS CHOIR<\u002Fbutton>\n          <\u002Fdiv>\n          <p class=\"prose\" style=\"margin:0;\"><em data-timbre-meaning=\"\" style=\"color:var(--gold);font-size:1.15rem;\">Strike a voice — hear the same kernel speak a different meaning.<\u002Fem><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== VI · THE FINALE ==================== -->\n  <section class=\"section band\" id=\"sec-6\" data-screen-label=\"VI · The Finale\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">🜏<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement VI · Proof Completion &amp; Retrospective Illumination<\u002Fdiv>\n        <h2 class=\"sec-title\">The Finale<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"incant reveal\" style=\"margin-top:0;\">\n        <blockquote>Movement IV is where the theorem receives its proof.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>The opening statement: <em>\"From a minor third and a rhythmic cell, can we generate a coherent musical universe?\"<\u002Fem> Movements I–III are lemmas. Movement IV is QED. But this isn't recapitulation — it's revelation of structure that was always present but imperceptible until traversed. A passage appears that combines the lyrical augmentation from Movement II, the rhythmic fragmentation from Movement III, and the opening horn call from Movement I — <em>simultaneously<\u002Fem>. They are contrapuntally compatible. This compatibility wasn't manufactured; it was inevitable given the generative kernel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SET-PIECE: MÖBIUS PROOF -->\n    <div class=\"wide reveal\" style=\"margin-top:50px;\">\n      <div class=\"piece\">\n        <div class=\"piece-head\">\n          <span class=\"ix\">Set-piece IV<\u002Fspan>\n          <span class=\"nm\">The Möbius Proof<\u002Fspan>\n          <span class=\"live\"><span class=\"dot\"><\u002Fspan>The end returns to the seed<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"grid-2\">\n          <div class=\"stage\"><canvas id=\"cvMobius\"><\u002Fcanvas><\u002Fdiv>\n          <div class=\"pad stack gap-lg\" style=\"border-left:1px solid var(--smoke);justify-content:center;\">\n            <span class=\"lbl lbl-gold\">Traverse the movements<\u002Fspan>\n            <div class=\"chips\" style=\"gap:12px;\">\n              <button class=\"chip\" data-mvt=\"0\">I <span class=\"sm\">prime · horn<\u002Fspan><\u002Fbutton>\n              <button class=\"chip\" data-mvt=\"1\">II <span class=\"sm\">augmented · lyrical<\u002Fspan><\u002Fbutton>\n              <button class=\"chip\" data-mvt=\"2\">III <span class=\"sm\">fragmented<\u002Fspan><\u002Fbutton>\n              <button class=\"chip\" data-mvt=\"3\">IV <span class=\"sm\">integration<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <button class=\"btn-solid\" id=\"proofBtn\" style=\"align-self:flex-start;margin-top:6px;\">◆ &nbsp;PLAY THE PROOF<\u002Fbutton>\n            <p class=\"lbl\" style=\"opacity:.8;line-height:1.7;\">All three materials sound at once, then dissolve to the bare interval — the proof complete, the pulse curving back to the seed.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col prose reveal\" style=\"margin-top:50px;\">\n      <p>The final cadence is not resolution in the traditional sense of tension-release. It's <strong>recognition<\u002Fstrong>. You hear the kernel in its simplest, most transparent form — the minor third, the rhythmic cell, utterly naked. And you realize: everything that happened across forty minutes was contained in those six notes. The symphony didn't add complexity to simplicity. It revealed the complexity that simplicity already contained.<\u002Fp>\n      <p>You remember the opening differently now. What seemed like a simple statement was actually a seed containing a forest. The ending doesn't conclude the symphony; it completes your understanding of the beginning. The symphony is a Möbius strip — when you reach the end, you discover you're back at the beginning, but on the other side of the surface.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== VII · THE DEEPER GRAMMAR ==================== -->\n  <section class=\"section\" id=\"sec-7\" data-screen-label=\"VII · The Deeper Grammar\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">ω<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement VII · What the Symphony Teaches About Emergence<\u002Fdiv>\n        <h2 class=\"sec-title\">The Deeper Grammar<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>Why compose this symphony? Not to create another beautiful object to consume, but to demonstrate a principle that applies far beyond music.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"margin-top:14px;\">\n        <div class=\"stack gap-md\">\n          <div class=\"piece\" style=\"padding:26px 30px;\"><p class=\"prose\" style=\"margin:0;\"><strong>Novelty emerges from discovered constraint<\u002Fstrong>, not unlimited freedom. When every possibility is available, choice becomes paralyzed or derivative. Commit to a small set of axioms, explore their implications with rigor, and you discover worlds you could never have reached through free invention.<\u002Fp><\u002Fdiv>\n          <div class=\"piece\" style=\"padding:26px 30px;\"><p class=\"prose\" style=\"margin:0;\"><strong>Complexity and coherence are not opposites.<\u002Fstrong> Hundreds of lines, thousands of notes — yet every element relates to every other through traceable transformations of the kernel. Self-similar structure at multiple scales: fractal beauty where the part contains the whole.<\u002Fp><\u002Fdiv>\n          <div class=\"piece\" style=\"padding:26px 30px;\"><p class=\"prose\" style=\"margin:0;\"><strong>Distributed agency produces unified coherence<\u002Fstrong> without hierarchical control. The instruments negotiate their way to harmony through mutual influence, not obedience to a conductor-dictator. Order doesn't require authority; it requires shared physics and mutual responsiveness.<\u002Fp><\u002Fdiv>\n          <div class=\"piece\" style=\"padding:26px 30px;\"><p class=\"prose\" style=\"margin:0;\"><strong>Meaning is retrospective.<\u002Fstrong> You cannot understand the beginning until you've experienced the ending, yet the ending only makes sense because of the journey through the middle. The hermeneutic circle made audible: part illuminates whole, whole illuminates part.<\u002Fp><\u002Fdiv>\n          <div class=\"piece\" style=\"padding:26px 30px;\"><p class=\"prose\" style=\"margin:0;\"><strong>Being and becoming are inseparable.<\u002Fstrong> The symphony doesn't exist as a static object you then experience over time. The symphony <em>is<\u002Fem> its unfolding. Not things that change, but patterns of change that achieve temporary stability — standing waves in the flux, resonances in the noise.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== VIII · THE COMPOSITIONAL INSTRUCTION ==================== -->\n  <section class=\"section band\" id=\"sec-8\" data-screen-label=\"VIII · The Compositional Instruction\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">⟁<\u002Fdiv>\n        <div class=\"sec-kicker\">Movement VIII · How to Actually Write This Symphony<\u002Fdiv>\n        <h2 class=\"sec-title\">The Compositional Instruction<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>The philosophical framework is beautiful — but can it be executed? Here is the methodology that materializes vision into score: seven phases, sixteen weeks.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col reveal\" style=\"margin-top:30px;\">\n      <div class=\"stack gap-md\">\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 1 · Weeks 1–2<\u002Fspan><span class=\"nm\">Kernel Selection &amp; Implication Mapping<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Choose the kernel: minor third + (••—). Map all transformations — inversion (major sixth), retrograde, augmentation, diminution, harmonic implications (stacked minor thirds produce diminished-seventh chords and octatonic scales). Build a possibility-space map: which transformations are nearby, which require developmental work.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 2 · Weeks 3–4<\u002Fspan><span class=\"nm\">Ecological Simulation<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Assign each family a starting niche: horns in the middle register; strings in rapid iterations and register extremes; woodwinds in augmented, lyrical versions; brass in stacked harmonic implications. Write short <em>encounter modules<\u002Fem> where two species interact — and let those encounters suggest harmonic progressions organically rather than pre-planning a tonal scheme.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 3 · Weeks 5–8<\u002Fspan><span class=\"nm\">Movement Sketching<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\"><strong>I.<\u002Fstrong> Exposition of the ecosystem — instruments enter serially. &nbsp;<strong>II.<\u002Fstrong> Temporal expansion — the kernel in extreme augmentation. &nbsp;<strong>III.<\u002Fstrong> Fragmentation and recombination — break the kernel into atoms. &nbsp;<strong>IV.<\u002Fstrong> Integration — demonstrate that all transformed material is contrapuntally compatible.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 4 · Weeks 9–10<\u002Fspan><span class=\"nm\">Memory-Architecture Design<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Map the four-dimensional structure: which themes from Movement I get recontextualized in III? Which harmonic implications seeded early only crystallize late? Design the retrospective moments — and the <em>mycorrhizal connections<\u002Fem>: deep motivic relationships that create \"aha\" moments on later encounters.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 5 · Weeks 11–13<\u002Fspan><span class=\"nm\">Orchestration as Semantics<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Assign timbral meaning consistently — certain combinations carry specific structural weight. Use orchestration to clarify structure: when the same pitch content appears in different timbres, ensure the difference carries significance. Preserve ecological niches; maintain instrumental identity through constraint.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 6 · Weeks 14–15<\u002Fspan><span class=\"nm\">Phase-Space Trajectory Refinement<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Verify every harmonic move is derivable from the kernel's implications. Re-compose anything that feels arbitrary so it emerges organically. Ensure the trajectory is <em>surprising yet inevitable<\u002Fem> — maximum information density while maintaining coherence.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"piece\" style=\"padding:0;\">\n          <div class=\"piece-head\"><span class=\"ix\">Phase 7 · Week 16<\u002Fspan><span class=\"nm\">The Proof-Check<\u002Fspan><\u002Fdiv>\n          <div class=\"pad\"><p class=\"prose\" style=\"margin:0;\">Can a listener apprehend the relationship between kernel and developed material? Does the finale genuinely reveal structure implicit in the opening? If you extracted any thirty-second passage, would it contain the symphony's DNA? Final criterion: <em>could this material only exist in THIS symphony?<\u002Fem> If not, it needs to be more deeply integrated with the kernel.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"col prose reveal\" style=\"margin-top:46px;\">\n      <p>The result is not a composition in the traditional sense — themes invented, arranged, orchestrated. It is a <em>grown structure<\u002Fem>, a crystallization of internal logic, a universe that bootstrapped itself from minimal initial conditions and proved, through its existence, that those conditions were sufficient.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ==================== IX · CODA ==================== -->\n  <section class=\"section\" id=\"sec-9\" data-screen-label=\"IX · Coda\">\n    <div class=\"col\">\n      <div class=\"sec-head reveal\">\n        <div class=\"sec-glyph\">τₖ<\u002Fdiv>\n        <div class=\"sec-kicker\">Coda · The Symphony That Composes Itself<\u002Fdiv>\n        <h2 class=\"sec-title\">Coda<\u002Fh2>\n        <div class=\"sec-rule\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>There is a final, vertiginous implication. If Symphony No. 5 truly follows from its generative kernel with rigorous logic, then the composer is not creating but <em>discovering<\u002Fem>. The symphony already exists in potential the moment you choose the kernel. Your job is to unfold what was already implicit, to reveal the structure that was always there.<\u002Fp>\n        <p>This is the threshold between composition and revelation. You're not imposing your will on passive material. You're listening to what the material wants to become, following the branching paths that emerge from the initial choice. The agency becomes distributed: part you, part the internal logic of the harmonic system, part the instruments' natural resonances, part the accidents of discovery.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"incant reveal\">\n        <blockquote>The symphony composes itself through you.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"prose reveal\">\n        <p>This doesn't diminish the composer's role — it transforms it. You become the medium through which possibility crystallizes into actuality. Your skill is not in invention but in <strong>recognition<\u002Fstrong>: recognizing which possibilities are genuinely implied by the kernel, which developments feel inevitable, which moments of complexity serve coherence rather than obscuring it.<\u002Fp>\n        <p>In the end, Symphony No. 5 is not a piece of music. It is a proof that meaning is generative, that coherence can emerge from simplicity, that structure and freedom are partners. It is a demonstration, in organized vibration, that the universe's tendency toward self-organization extends to semantic systems, to aesthetic systems, to any domain where elements influence each other through shared constraints. The symphony is a universe in miniature — sculpting form from frequency, making meaning from vibration, singing itself into being.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <footer class=\"foot reveal\">\n      <div class=\"sig\">🜏<\u002Fdiv>\n      <p class=\"line\">The minor third resonates. The kernel unfolds. The composition is complete.<\u002Fp>\n      <div class=\"tk\">Composed within the constraint of the generative kernel · τₖ → 1.00<\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<!-- ==================== PERSISTENT KERNEL PLAYER ==================== -->\n<div class=\"kplayer\" aria-label=\"Kernel player\">\n  <button class=\"play\" title=\"Sound the kernel\">▶<\u002Fbutton>\n  <div class=\"pbody\">\n    <span class=\"ptitle\">THE KERNEL<\u002Fspan>\n    <span class=\"pval\" data-pnote=\"\"><\u002Fspan>\n    <span class=\"pval\" data-ptk=\"\" style=\"color:var(--gold-dim);font-size:10px;\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<script src=\"84a6bd31-2290-448d-b989-eb92453cfdd6\"><\u002Fscript>\n<script src=\"7b189bf4-caab-4f57-8f13-3ce57af85903\"><\u002Fscript>\n<script src=\"023d4ffb-737f-457f-a82e-288fb338a98c\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
